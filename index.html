<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">
  <title>ant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #20202b 0%, #101015 45%, #08080b 100%);
      color: #f5f5f7;
      font-family: 'Inter', sans-serif;
    }

    .card {
      width: 100%;
      max-width: 390px;
      padding: 32px 25px;
      text-align: center;
      background: rgba(20, 20, 27, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .avatar {
      width: 104px;
      height: 104px;
      display: block;
      margin: 0 auto 18px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.18);
      background: #24242d;
      box-shadow: 0 0 30px rgba(120, 100, 255, 0.15);
    }

    h1 {
      font-size: 29px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 8px;
      margin-bottom: 25px;
      color: #9999a8;
      font-size: 13px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 55px;
      padding: 0 17px;
      color: #f5f5f7;
      text-decoration: none;
      background: #191920;
      border: 1px solid #292933;
      border-radius: 14px;
      transition: transform 0.2s ease, background 0.2s ease,
                  border-color 0.2s ease;
    }

    .link:hover {
      transform: translateY(-3px);
      background: #24242e;
      border-color: #454553;
    }

    .link-icon {
      width: 23px;
      flex-shrink: 0;
      font-size: 20px;
      text-align: center;
    }

    .discord-icon {
      color: #5865f2;
    }

    .github-icon {
      color: #f5f5f7;
    }

    .roblox-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .link-name {
      flex: 1;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
    }

    .external {
      color: #777784;
      font-size: 12px !important;
    }

    .footer {
      margin-top: 25px;
      color: #656572;
      font-size: 11px;
    }

    @media (max-width: 420px) {
      .card {
        padding: 27px 19px;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <!-- Profile picture -->
    <img
      class="avatar"
      src="https://cdn.discordapp.com/avatars/372966022954876929/5e015e9cc5e6ecd19eccdd60737dd1ff.png?size=256"
      alt="ant's profile picture"
      onerror="this.onerror=null;this.src='avatar.png';"
    >

    <h1>ant</h1>
    <p class="subtitle">my links ♡</p>

    <nav class="links" aria-label="Social links">

      <!-- Discord -->
      <a
        class="link"
        href="https://discord.com/users/372966022954876929"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="link-icon fa-brands fa-discord discord-icon"></i>
        <span class="link-name">Discord</span>
        <i class="fa-solid fa-arrow-up-right-from-square external"></i>
      </a>

      <!-- GitHub -->
      <a
        class="link"
        href="https://github.com/e5p6"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="link-icon fa-brands fa-github github-icon"></i>
        <span class="link-name">GitHub</span>
        <i class="fa-solid fa-arrow-up-right-from-square external"></i>
      </a>

      <!-- Roblox: one button only -->
      <a
        class="link"
        href="https://www.roblox.com/search/users?keyword=scopeest"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg class="roblox-icon" viewBox="0 0 100 100" role="img" aria-label="Roblox">
          <g transform="rotate(15 50 50)">
            <rect x="17" y="17" width="66" height="66" fill="white"/>
            <rect x="37" y="37" width="26" height="26" fill="#191920"/>
          </g>
        </svg>
        <span class="link-name">Roblox</span>
        <i class="fa-solid fa-arrow-up-right-from-square external"></i>
      </a>

    </nav>

    <p class="footer">made by ant</p>
  </main>
</body>
</html>
