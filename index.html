
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">
  <title>ant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0b0b0f;
      color: #f5f5f7;
      font-family: 'Inter', sans-serif;
    }

    .card {
      width: 100%;
      max-width: 370px;
      padding: 30px 24px;
      text-align: center;
      background: #121218;
      border: 1px solid #25252e;
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .avatar {
      width: 100px;
      height: 100px;
      display: block;
      margin: 0 auto 18px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid #30303b;
      background: #20202a;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 7px;
      margin-bottom: 25px;
      color: #858591;
      font-size: 13px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 54px;
      padding: 0 16px;
      color: #f5f5f7;
      text-decoration: none;
      background: #191920;
      border: 1px solid #292933;
      border-radius: 13px;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }

    .link:hover {
      background: #22222b;
      border-color: #41414f;
      transform: translateY(-2px);
    }

    .link-icon {
      width: 23px;
      flex-shrink: 0;
      font-size: 20px;
      text-align: center;
    }

    .discord-icon {
      color: #5865f2;
    }

    .github-icon {
      color: #f5f5f7;
    }

    .roblox-icon {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
      display: block;
    }

    .link-name {
      flex: 1;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
    }

    .external {
      color: #777784;
      font-size: 12px !important;
    }

    .footer {
      margin-top: 24px;
      color: #666672;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="card">
    <img
      class="avatar"
      src="https://cdn.discordapp.com/avatars/372966022954876929/5e015e9cc5e6ecd19eccdd60737dd1ff.png?size=256"
      alt="ant"
      onerror="this.onerror=null;this.src='avatar.png';"
    >

    <h1>ant</h1>
    <p class="subtitle">my links ♡</p>

    <nav class="links" aria-label="Social links">
      <a class="link" href="https://discord.com/users/372966022954876929" target="_blank" rel="noopener noreferrer">
        <i class="link-icon fa-brands fa-discord discord-icon"></i>
        <span class="link-name">Discord</span>
        <i class="fa-solid fa-arrow-up-right-from-square external"></i>
      </a>

      <a class="link" href="https://github.com/e5p6" target="_blank" rel="noopener noreferrer">
        <i class="link-icon fa-brands fa-github github-icon"></i>
        <span class="link-name">GitHub</span>
        <i class="fa-solid fa-arrow-up-right-from-square external"></i>
      </a>

      <a class="link" href="https://www.roblox.com/search/users?keyword=scopeest" target="_blank" rel="noopener noreferrer">
        <svg class="roblox-icon" viewBox="0 0 100 100" aria-label="Roblox" role="img">
          <g transform="rotate(15 50 50)">
            <rect x="17" y="17" width="66" height="66" fill="white"/>
            <rect x="37" y="37" width="26" height="26" fill="#191920"/>
          </g>
        </svg>
        <span class="link-name">Roblox — scopeest</span>
        <i class="fa-solid fa-arrow-up-right-from-square external"></i>
      </a>

      <a class="link" href="https://www.roblox.com/search/users?keyword=enformlnn" target="_blank" rel="noopener noreferrer">
        <svg class="roblox-icon" viewBox="0 0 100 100" aria-label="Roblox" role="img">
          <g transform="rotate(15 50 50)">
            <rect x="17" y="17" width="66" height="66" fill="white"/>
            <rect x="37" y="37" width="26" height="26" fill="#191920"/>
          </g>
        </svg>
        <span class="link-name">Roblox — enformlnn</span>
        <i class="fa-solid fa-arrow-up-right-from-square external"></i>
      </a>
    </nav>

    <p class="footer">made by ant</p>
  </main>
</body>
</html>
